<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMentor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div>
            <h1>StoreMentor</h1>
            <p>Your AI Business Partner</p>
        </div>
    </header>

    <main class="dashboard">

        <section class="welcome">
            <h2>Business Dashboard</h2>
            <p>Here's what's happening with your business.</p>
        </section>

        <section class="stats">

            <div class="stat-card">
                <span>Total Merchants</span>
                <strong id="merchant-count">-</strong>
            </div>

            <div class="stat-card">
                <span>Total Monthly Sales</span>
                <strong id="total-sales">-</strong>
            </div>

        </section>

        <section class="merchants-section">

            <h2>Merchants</h2>

            <div id="merchant-list">
                Loading merchants...
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
